name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept SDK Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Prepare Bootstrap
        run: |
          chmod +x ./gradlew scripts/update_bootstrap.py
          ./gradlew downloadBootstraps downloadJetBrainsMono --warning-mode none --no-problems-report
          python3 scripts/update_bootstrap.py

      - name: Build
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: |
          ./gradlew assembleDebug assembleRelease --warning-mode none --no-problems-report --stacktrace
          mkdir -p dist
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp -f "$DEBUG_APK" dist/termux-debug.apk
          cp -f "$RELEASE_APK" dist/termux-release.apk
          APKSIGNER=$(find ${ANDROID_HOME}/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose dist/termux-debug.apk
            "$APKSIGNER" verify --verbose dist/termux-release.apk
          fi
          ls -lh dist/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: termux-debug
          path: dist/termux-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: termux-release
          path: dist/termux-release.apk
          if-no-files-found: error

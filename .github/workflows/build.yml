name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: mtermux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Git Init
        run: |
          git config --global init.defaultBranch main
          git config --global advice.defaultBranchName false

      - name: Checkout
        uses: actions/checkout@main

      - name: Node.js
        uses: actions/setup-node@main
        with:
          node-version: 'latest'

      - name: Python
        uses: actions/setup-python@main
        with:
          python-version: '3.x'

      - name: Java
        uses: actions/setup-java@main
        with:
          distribution: 'temurin'
          java-version: |
            28-ea
            25
          check-latest: true

      - name: CCache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: mtermux-ccache
          max-size: 2G

      - name: Cache Bootstrap
        uses: actions/cache@main
        with:
          path: |
            app/src/main/cpp/bootstrap-aarch64.zip
            app/src/main/cpp/.bootstrap_patched_mtermux_v5.stamp
            app/src/main/assets/fonts/JetBrainsMono.ttf
          key: mtermux-bootstrap-v5-${{ hashFiles('scripts/update_bootstrap.py') }}
          restore-keys: |
            mtermux-bootstrap-v5-

      - name: Cache Gradle
        uses: actions/cache@main
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/.cxx
          key: mtermux-gradle-cxx-v5-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml', 'app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: |
            mtermux-gradle-cxx-v5-${{ runner.os }}-

      - name: SDK Licenses
        run: |
          JAVA_HOME="${JAVA_HOME_25_X64:-$JAVA_HOME}" yes 2>/dev/null | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Bootstrap
        run: |
          chmod +x ./gradlew scripts/update_bootstrap.py
          python3 scripts/update_bootstrap.py

      - name: Build APK
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: |
          if [ -n "${JAVA_HOME_28_X64:-}" ] && JAVA_HOME="$JAVA_HOME_28_X64" ./gradlew --version >/dev/null 2>&1; then
            export JAVA_HOME="$JAVA_HOME_28_X64"
          elif [ -n "${JAVA_HOME_25_X64:-}" ]; then
            export JAVA_HOME="$JAVA_HOME_25_X64"
          fi
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version

          ./gradlew assembleRelease \
            -Dorg.gradle.java.installations.paths="${JAVA_HOME_28_X64:-},${JAVA_HOME_25_X64:-}" \
            --build-cache \
            --parallel \
            --warning-mode all \
            --stacktrace

          mkdir -p dist
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          RELEASE_IDSIG=$(find app/build/outputs/apk/release -name "*.apk.idsig" | head -n 1)
          cp -f "$RELEASE_APK" dist/MTermux-release.apk
          if [ -n "$RELEASE_IDSIG" ]; then
            cp -f "$RELEASE_IDSIG" dist/MTermux-release.apk.idsig
          fi

          APKSIGNER=$(find ${ANDROID_HOME}/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            if [ ! -f dist/MTermux-release.apk.idsig ]; then
              "$APKSIGNER" sign \
                --ks app/testkey_untrusted.jks \
                --ks-key-alias alias \
                --ks-pass pass:xrj45yWGLbsO7W0v \
                --key-pass pass:xrj45yWGLbsO7W0v \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                --v4-signing-enabled true \
                --out dist/MTermux-release.apk \
                dist/MTermux-release.apk
            fi
            "$APKSIGNER" verify --verbose --v4-signature-file dist/MTermux-release.apk.idsig dist/MTermux-release.apk
          fi
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@main
        with:
          name: MTermux-release
          path: |
            dist/MTermux-release.apk
            dist/MTermux-release.apk.idsig
          if-no-files-found: error

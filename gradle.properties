# ============================================================================
# MTermux (Material Termux) — High-Performance Gradle Build Configuration
# ============================================================================
org.gradle.jvmargs=-Xmx6g -XX:+UseZGC -XX:+ZGenerational -XX:+TieredCompilation -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=true

# AndroidX & R8 Full Mode Optimization
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
android.defaults.buildfeatures.buildconfig=true

# Kotlin 2.5.0-Beta2 K2 Compiler Optimizations
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.stdlib.default.dependency=true
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseZGC -XX:+ZGenerational
